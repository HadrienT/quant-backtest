repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3  # same major as quant-modeling and its CI (clang-format-18)
    hooks:
      - id: clang-format
        types_or: [c, c++]
        args: [--style=file]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
