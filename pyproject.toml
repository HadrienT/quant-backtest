[build-system]
requires = ["scikit-build-core>=0.10.2", "pybind11>=3.0.1"]
build-backend = "scikit_build_core.build"

[project]
name = "quantbacktest"
dynamic = ["version"]
description = "Pybind11 bindings for the quantBacktest engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/pypkg"
build.targets = ["quantbacktest"]

# One version, declared by project() in CMakeLists.txt.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(quantBacktest VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.scikit-build.cmake]
version = ">=3.25"
build-type = "Release"

[tool.scikit-build.cmake.define]
QB_BUILD_PYTHON = "ON"
QB_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
